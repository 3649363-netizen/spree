        expiry_notice: Срок действия ссылки-приглашения истечёт через 30 дней.
        greeting: Здравствуйте!
        ignore_notice: Если вы не ожидали это приглашение, просто проигнорируйте письмо.
        instructions: Вас пригласили присоединиться к компании %{company} в магазине
