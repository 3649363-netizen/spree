        subject: Аннулирование заказа
        dear_customer: Здравствуйте, %{name}!
        order_summary_canceled: Сводка по заказу %{number} [ОТМЕНЁН]
      confirm_email:
        instructions: Пожалуйста, проверьте детали заказа.
        subject: Подтверждение заказа
        dear_customer: Здравствуйте, %{name}!
        order_summary: Сводка по заказу %{number}
      payment_link_email:
        message: Нажмите кнопку ниже, чтобы оплатить ваш заказ.
