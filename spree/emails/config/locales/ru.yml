        instructions: Вы получили новый заказ.
        order_summary: Сводка по заказу %{number}
        subject: "%{store_name} получил новый заказ"
      subtotal: "Промежуточный итог:"
      total: "Итого по заказу:"
      po_number: "Номер заказа покупателя: %{number}"
    company_mailer:
