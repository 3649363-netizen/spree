ru:
  spree:
    customer_mailer:
      password_reset_email:
        action: Сбросить пароль
        expiry_notice: Ссылка для сброса пароля скоро истечёт. Если вы не запрашивали
          сброс, никаких действий не требуется.
        greeting: Здравствуйте, %{name},
        ignore_notice: Если вы не запрашивали сброс пароля, просто проигнорируйте это
          письмо. Ваш пароль не будет изменён.
        instructions: Мы получили запрос на сброс вашего пароля. Нажмите кнопку ниже,
          чтобы выбрать новый пароль.
        subject: Инструкции по сбросу пароля
      data_export_email:
        action: Скачать ваши данные
        expiry_notice: Срок действия ссылки для скачивания истечёт %{date}.
        greeting: Здравствуйте!
        ignore_notice: Если вы не запрашивали копию данных, свяжитесь с нами.
        instructions: Копия хранящихся у нас персональных данных готова. Нажмите кнопку
          ниже, чтобы скачать её.
        subject: Ваши данные готовы к скачиванию
      data_request_confirmation_email:
        access:
          instructions: Мы получили запрос на копию хранящихся у нас персональных данных.
            После подтверждения мы отправим вам ссылку для скачивания файла.
          subject: Подтвердите запрос данных
        action: Проверить и подтвердить
        erasure:
          instructions: Мы получили запрос на безвозвратное удаление хранящихся у нас
            персональных данных, включая имена и адреса в прошлых заказах. Это
            действие нельзя отменить.
          subject: Подтвердите запрос на удаление данных
        expiry_notice: Срок действия ссылки истечёт %{date}.
        greeting: Здравствуйте!
        ignore_notice: Если вы не отправляли этот запрос, проигнорируйте письмо —
          никаких действий не произойдёт.
    newsletter_mailer:
      email_confirmation:
        dear_customer: Здравствуйте,
        ignore_disclaimer: Если вы не запрашивали это, просто проигнорируйте это письмо.
        instructions: Нажмите кнопку ниже, чтобы подтвердить ваш адрес электронной почты.
        message_copy_link: "Если кнопка не работает, скопируйте и вставьте следующую
          ссылку в браузер:"
        subject: Подтвердите ваш адрес электронной почты
        verify_email_address_link: Подтвердить адрес электронной почты
    order_mailer:
      cancel_email:
