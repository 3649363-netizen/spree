          few: "Заказ будет доставлен отдельными отправлениями: %{count}."
          many: "Заказ будет доставлен отдельными отправлениями: %{count}."
          other: "Заказ будет доставлен отдельными отправлениями: %{count}."
        dear_customer: Здравствуйте, %{name}!
        instructions: Сохраните сведения о заказе %{number}, приведённые ниже.
        subject: Подтверждение заказа
      delivery: Доставка
      delivery_numbered: Отправление %{position} из %{count}
      nothing_to_ship: Нет товаров для отправки
      sold_by: "Продавцы: %{sellers}"
      store_owner_notification_email:
        heading: Получен новый заказ
        instructions:
          one: Поступил новый заказ.
          few: "Поступил новый заказ, разделённый на заказы продавцов: %{count}."
          many: "Поступил новый заказ, разделённый на заказы продавцов: %{count}."
          other: "Поступил новый заказ, разделённый на заказы продавцов: %{count}."
        purchase_summary: Сводка по заказу %{number}
        subject: В магазине %{store_name} поступил новый заказ
    return_mailer:
      refunded_email:
        dear_customer: Здравствуйте, %{name}!
        instructions: Средства за возврат по заказу %{number} перечислены.
        refund_summary: Сведения о возврате средств
        returned_items: Возвращённые товары
        subject: Средства за возврат товара перечислены
        total_refunded: "Возвращено всего: %{total}"
    seller_mailer:
      approved_email:
        action: Перейти в кабинет продавца
        heading: Ваша заявка одобрена
        message: Ваша заявка на продажу в магазине %{store_name} одобрена. Теперь вы
          можете размещать товары и принимать заказы.
        subject: Вам разрешено продавать в магазине %{store_name}
      get_in_touch: "Если это ошибка, ответьте на письмо или напишите нам: %{store_email}."
      greeting: Здравствуйте, %{seller_name}!
      rejected_email:
        heading: Решение по вашей заявке
        message: Ваша заявка на продажу в магазине %{store_name} не одобрена.
        subject: Решение по заявке на продажу в магазине %{store_name}
      suspended_email:
        heading: Ваша учётная запись приостановлена
        message: Продажи в магазине %{store_name} для вашей учётной записи
          приостановлены. Товары и история заказов не затронуты.
        subject: Продажи в магазине %{store_name} приостановлены
